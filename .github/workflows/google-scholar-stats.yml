name: Google Scholar citations

# Google Scholar has no public API, so the count is scraped once a day and
# published to the google-scholar-stats branch for index.html to read.
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch citation statistics
        env:
          GOOGLE_SCHOLAR_ID: h1I6LJcAAAAJ
        run: python google_scholar_crawler/main.py

      - name: Publish to the stats branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./results
          publish_branch: google-scholar-stats
          keep_files: false
          force_orphan: true
